<!DOCTYPE html>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-sans text-on-surface">
<!-- Login Container -->
<main class="w-full max-w-[420px] bg-surface rounded-xl custom-shadow border border-outline-variant p-8 md:p-10 flex flex-col gap-8">
<!-- Header / Logo -->
<header class="flex flex-col items-center gap-2">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    task_alt
                </span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">GesTask</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant text-center">Academic Management Portal</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-body-sm font-body-sm text-on-surface-variant" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">
                        mail
                    </span>
<input class="w-full bg-surface border border-outline-variant rounded-md py-2.5 pl-10 pr-4 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary-container transition-all" id="email" name="email" placeholder="ejemplo@institucion.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-body-sm font-body-sm text-on-surface-variant" for="password">Contraseña</label>
<a class="text-label-md font-label-md text-primary hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">
                        lock
                    </span>
<input class="w-full bg-surface border border-outline-variant rounded-md py-2.5 pl-10 pr-4 text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 bg-primary-container hover:bg-primary text-on-primary-container hover:text-on-primary text-label-md font-label-md py-3 rounded-md transition-all flex items-center justify-center gap-2" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[18px]">
                    login
                </span>
</button>
</form>
<!-- Security Badge Context -->
<div class="flex items-center justify-center gap-2 mt-4 text-outline">
<span class="material-symbols-outlined text-[16px]">
                verified_user
            </span>
<span class="text-label-md font-label-md uppercase tracking-wider">Acceso Seguro</span>
</div>
</main>
</body></html>
